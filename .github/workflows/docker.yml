name: docker
# Builds the image for linux/amd64 and linux/arm64 and pushes it to
# ghcr.io/<owner>/indic-voice-clone when main changes (a merged pull request).
# Pull requests that touch the image build it for amd64 only, without pushing,
# so a broken Dockerfile is caught before it reaches main.
on:
  push:
    branches: [main]
  pull_request:
    paths: [Dockerfile, .dockerignore, pyproject.toml, constraints.txt, "src/**", .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - name: Build for amd64 and load it locally
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: voiceclone:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm voiceclone:test --help > /dev/null
          docker run --rm --entrypoint python voiceclone:test -c "import torch, transformers, peft, speechbrain, fastapi, voiceclone.studio.app; print('torch', torch.__version__)"
          docker run -d --name studio -p 8000:8000 voiceclone:test
          for _ in $(seq 30); do curl -sf localhost:8000/api/config > /dev/null && break; sleep 2; done
          curl -sf localhost:8000/api/config
          curl -sf localhost:8000/ | grep -q "Voice studio"
          docker rm -f studio
      - name: Build both platforms and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
